name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought of (optional)
    validations:
      required: false

  - type: dropdown
    id: analyzer
    attributes:
      label: Related analyzer (if applicable)
      options:
        - crawlability
        - tdm
        - structured_data
        - extractability
        - attribution
        - cli / output
        - other
    validations:
      required: false
