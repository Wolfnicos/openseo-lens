name: Bug Report
description: Something is broken or produces wrong results
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL analyzed
      description: The URL you ran openseo-lens against (if applicable and public)
      placeholder: https://example.com
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: openseo-lens analyze https://example.com --format json
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the full output or error message
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: openseo-lens version
      placeholder: "0.1.0"
    validations:
      required: true
